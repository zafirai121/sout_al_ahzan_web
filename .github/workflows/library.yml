name: Library upkeep

# Adds the songs whose files are in the bucket but have no track, removes the
# tracks whose file is gone, and deletes uploads that never became a track
# (scripts/library.mjs, through /api/admin/library, which checks each step);
# "tidy" cleans titles and removes copies and short clips (scripts/tidy.mjs);
# "categories" writes each category as the apps' code and sorts the tracks
# in "منوعات" by their titles (scripts/categories.mjs); "reciter" gives a
# song credited to another reciter as well its reciter's name (scripts/reciter.mjs);
# "reciters" gives each reciter one name on all their tracks (scripts/reciters.mjs);
# "orphans" only lists the songs no track plays (scripts/orphans.mjs); "check"
# only shows a few tracks, backups or keys as stored (scripts/check.mjs);
# "albums-…" reads a reciter's releases and gives their tracks albums (scripts/albums.mjs);
# "admin-…" gives the site's owner the admin role (scripts/admin.mjs); "covers" keeps a
# few playlists' covers and reciters' photos on the reports branch (scripts/covers.mjs);
# "cutouts-…" takes the background away from the reciters' photos (scripts/cutouts.*).
# "plan" (on a push, or by hand) only says what it would do.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/library.yml', 'scripts/library.mjs', 'functions/api/admin/library.js']
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan, import, delete, add-plan, add, tidy-plan, tidy, categories-plan, categories, reciter-plan, reciter, reciters-plan, reciters, orphans, check, albums-probe, albums-plan, albums-library, albums-write-plan, albums-write, admin-plan, admin, covers, cutouts-plan or cutouts'
        type: choice
        options: [plan, import, delete, add-plan, add, tidy-plan, tidy, categories-plan, categories, reciter-plan, reciter, reciters-plan, reciters, orphans, check, albums-probe, albums-plan, albums-library, albums-write-plan, albums-write, admin-plan, admin, covers, cutouts-plan, cutouts]
        default: plan
      reciter:
        description: 'reciter / reciter-plan: whose the songs are (albums-…: their name on shiavoice / their albums file)'
        type: string
        required: false
      titles:
        description: 'reciter / reciter-plan: their titles, separated by |'
        type: string
        required: false
      files:
        description: 'add / add-plan: the songs to add, their keys in the bucket separated by | (check: what to look at)'
        type: string
        required: false
      category:
        description: 'add / add-plan: their category (else as their folder''s tracks)'
        type: string
        required: false

permissions:
  contents: write # the albums reports, on the reports branch
  id-token: write

concurrency:
  group: library
  cancel-in-progress: false

jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ffprobe (the songs' lengths)
        if: inputs.mode == 'import' || inputs.mode == 'orphans' || startsWith(inputs.mode, 'add')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - uses: actions/setup-python@v5
        if: startsWith(inputs.mode, 'cutouts')
        with:
          python-version: '3.11'
      - name: rembg (the reciters' cut-out photos)
        if: startsWith(inputs.mode, 'cutouts')
        run: python3 -m pip install -q "rembg[cpu]==2.0.59"
      - name: Library upkeep (${{ inputs.mode || 'plan' }})
        env:
          MODE: ${{ inputs.mode || 'plan' }}
          RECITER: ${{ inputs.reciter }}
          TITLES: ${{ inputs.titles }}
          FILES: ${{ inputs.files }}
          CATEGORY: ${{ inputs.category }}
        run: |
          case "$MODE" in
            cutouts*) node scripts/cutouts.mjs prepare && python3 scripts/cutouts.py && node scripts/cutouts.mjs upload; exit $? ;;
            tidy*) script=tidy ;;
            categories*) script=categories ;;
            orphans) script=orphans ;;
            check) script=check ;;
            albums*) script=albums ;;
            admin*) script=admin ;;
            covers) script=covers ;;
            reciters*) script=reciters ;;
            reciter*) script=reciter ;;
            *) script=library ;;
          esac
          node "scripts/$script.mjs"
      - name: Keep the report (albums)
        if: (startsWith(inputs.mode, 'albums') || inputs.mode == 'covers' || inputs.mode == 'cutouts-plan') && hashFiles('out/**') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b reports
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Albums report"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" reports
